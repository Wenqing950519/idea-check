<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="report-json-sha256" content="{{REPORT_HASH}}">
  <title>實習 Offer 決策摘要</title>
  <style>
    :root {
      --ink: #17201b;
      --muted: #667068;
      --paper: #f4f2eb;
      --card: #fffef9;
      --line: #d8d8cf;
      --green: #176b4d;
      --green-soft: #e4f2eb;
      --amber: #9a5b00;
      --amber-soft: #fff0cf;
      --red: #9c352d;
      --red-soft: #f9e5e2;
      --blue: #315c76;
      --shadow: 0 18px 55px rgba(23, 32, 27, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 0%, rgba(23,107,77,.10), transparent 28rem),
        var(--paper);
      font-family: Inter, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.6;
    }
    main { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 24px 0 72px; }
    .hero {
      min-height: calc(100vh - 48px);
      display: grid;
      align-content: center;
      gap: 22px;
      padding: clamp(24px, 5vw, 64px);
      border: 1px solid rgba(23,32,27,.10);
      border-radius: 30px;
      background: rgba(255,254,249,.92);
      box-shadow: var(--shadow);
    }
    .eyebrow, .meta { color: var(--muted); font-size: .84rem; letter-spacing: .08em; text-transform: uppercase; }
    .company { margin: 0; font-size: clamp(1.6rem, 4vw, 3.2rem); line-height: 1.15; }
    .hero-grid { display: grid; grid-template-columns: minmax(200px, .65fr) 1.35fr; gap: 28px; align-items: stretch; }
    .decision-box { padding: 26px; border-radius: 24px; background: var(--ink); color: white; display: flex; flex-direction: column; justify-content: space-between; }
    .score { font-size: clamp(4rem, 10vw, 7.6rem); line-height: .95; font-weight: 800; letter-spacing: -.07em; }
    .score small { font-size: 1rem; letter-spacing: 0; opacity: .65; }
    .verdict { display: inline-flex; width: fit-content; margin-top: 24px; padding: 7px 12px; border: 1px solid currentColor; border-radius: 999px; font-weight: 750; }
    .headline { margin: 0 0 18px; font-size: clamp(1.45rem, 3.2vw, 2.5rem); line-height: 1.25; }
    .base-case { margin: 0 0 18px; padding: 14px 16px; border-left: 4px solid var(--blue); border-radius: 0 14px 14px 0; background: #eef4f7; }
    .base-case h3 { margin: 0 0 4px; font-size: .85rem; color: var(--blue); letter-spacing: .04em; }
    .base-case p { margin: 0; }
    .reason-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .reason-card { padding: 18px; border-radius: 18px; }
    .reason-card.good { background: var(--green-soft); }
    .reason-card.bad { background: var(--red-soft); }
    .reason-card h3 { margin: 0 0 8px; font-size: .9rem; }
    .reason-card ul { margin: 0; padding-left: 1.2rem; }
    section { margin-top: 56px; }
    .section-head { display: flex; gap: 18px; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
    h2 { margin: 0; font-size: clamp(1.45rem, 3vw, 2rem); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 22px; }
    .score-list { display: grid; gap: 14px; }
    .score-row { display: grid; grid-template-columns: 160px 1fr 46px; gap: 16px; align-items: center; }
    .bar { height: 12px; overflow: hidden; border-radius: 999px; background: #e8e7df; }
    .bar > span { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--blue), var(--green)); }
    .score-note { grid-column: 2 / -1; margin: -10px 0 4px; color: var(--muted); font-size: .92rem; }
    .outcomes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .resume-experiences { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 14px; }
    .resume-experience { border-top: 5px solid var(--blue); }
    .resume-experience h3 { margin: 0 0 10px; }
    .resume-bullet { margin: 0; padding: 14px; border-radius: 12px; background: #eef4f7; font-weight: 650; }
    .experience-label { margin: 16px 0 3px; color: var(--muted); font-size: .78rem; font-weight: 750; letter-spacing: .04em; }
    .outcomes h3, .risk h3, .fit h3 { margin-top: 0; }
    ul.clean { margin: 0; padding-left: 1.15rem; }
    .risks { display: grid; gap: 12px; }
    .risk { border-left: 5px solid var(--amber); }
    .risk.high { border-left-color: var(--red); }
    .risk.low { border-left-color: var(--green); }
    .risk-meta { color: var(--muted); font-size: .88rem; }
    .fit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .uncertainties { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .uncertainty h3 { margin: 0 0 10px; }
    .uncertainty dt { margin-top: 12px; color: var(--muted); font-size: .78rem; font-weight: 750; letter-spacing: .04em; text-transform: uppercase; }
    .uncertainty dd { margin: 2px 0 0; }
    details { background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
    summary { cursor: pointer; padding: 20px 22px; font-weight: 750; }
    .evidence-list { display: grid; gap: 10px; padding: 0 22px 22px; }
    .evidence { padding-top: 12px; border-top: 1px solid var(--line); }
    .tag { display: inline-block; padding: 2px 8px; margin-right: 6px; border-radius: 999px; background: #ecece5; color: var(--muted); font-size: .78rem; }
    .evidence a { color: var(--blue); overflow-wrap: anywhere; }
    .empty { color: var(--muted); font-style: italic; }
    footer { margin-top: 36px; color: var(--muted); font-size: .8rem; text-align: center; }
    @media (max-width: 760px) {
      .hero { min-height: auto; border-radius: 22px; }
      .hero-grid, .reason-grid, .outcomes, .resume-experiences, .fit-grid, .uncertainties { grid-template-columns: 1fr; }
      .score-row { grid-template-columns: 120px 1fr 38px; gap: 10px; }
      .score-note { grid-column: 1 / -1; margin: 0 0 8px; }
    }
    @media print {
      body { background: white; }
      main { width: 100%; padding: 0; }
      .hero { min-height: auto; box-shadow: none; }
      section { break-inside: avoid; margin-top: 28px; }
      details > * { display: block; }
    }
  </style>
</head>
<body data-report-json-sha256="{{REPORT_HASH}}">
  <main>
    <header class="hero">
      <div>
        <div class="eyebrow">Internship Offer Decision</div>
        <h1 class="company" id="company-title"></h1>
        <div class="meta" id="report-meta"></div>
      </div>
      <div class="hero-grid">
        <div class="decision-box">
          <div>
            <div class="eyebrow">推薦分數</div>
            <div class="score" id="hero-score"></div>
          </div>
          <div class="verdict" id="hero-verdict"></div>
        </div>
        <div>
          <h2 class="headline" id="headline"></h2>
          <div class="base-case"><h3>Base Case 判斷</h3><p id="base-case"></p></div>
          <div class="reason-grid">
            <article class="reason-card good"><h3>最主要的加分</h3><ul id="reasons-for"></ul></article>
            <article class="reason-card bad"><h3>最主要的扣分</h3><ul id="reasons-against"></ul></article>
          </div>
        </div>
      </div>
    </header>

    <section aria-labelledby="scores-title">
      <div class="section-head"><h2 id="scores-title">五項判斷</h2><span class="meta">分數呈現判斷，不採機械平均</span></div>
      <div class="card score-list" id="score-list"></div>
    </section>

    <section aria-labelledby="outcomes-title">
      <div class="section-head"><h2 id="outcomes-title">3–6 個月後能帶走什麼</h2></div>
      <div class="resume-experiences" id="resume-experiences"></div>
      <div class="outcomes" id="outcomes"></div>
    </section>

    <section aria-labelledby="risks-title">
      <div class="section-head"><h2 id="risks-title">主要風險</h2></div>
      <div class="risks" id="risks"></div>
    </section>

    <section aria-labelledby="uncertainties-title">
      <div class="section-head"><h2 id="uncertainties-title">主要決策不確定性</h2><span class="meta">已反映在 Base Case 與信心程度</span></div>
      <div class="uncertainties" id="uncertainties"></div>
    </section>

    <section aria-labelledby="fit-title">
      <div class="section-head"><h2 id="fit-title">適合誰</h2></div>
      <div class="fit-grid">
        <article class="card fit"><h3>比較適合</h3><ul class="clean" id="suitable"></ul></article>
        <article class="card fit"><h3>可能不適合</h3><ul class="clean" id="unsuitable"></ul></article>
      </div>
    </section>

    <section aria-labelledby="evidence-title">
      <details>
        <summary id="evidence-title">Evidence（展開查看來源）</summary>
        <div class="evidence-list" id="evidence-list"></div>
      </details>
    </section>
    <footer id="fingerprint"></footer>
  </main>

  <script type="application/json" id="report-data">{{REPORT_JSON}}</script>
  <script>
    (() => {
      "use strict";
      const report = JSON.parse(document.getElementById("report-data").textContent);
      const byId = id => document.getElementById(id);
      const appendText = (parent, tag, text, className) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        node.textContent = text;
        parent.appendChild(node);
        return node;
      };
      const fillList = (id, items) => {
        const root = byId(id);
        if (!items || !items.length) return appendText(root, "li", "目前無足夠資訊", "empty");
        items.forEach(item => appendText(root, "li", item));
      };
      const verdictLabels = {
        take: "Take",
        conditional_take: "Conditional Take",
        decline: "Decline"
      };
      const levelLabels = {
        company_title: "公司／職位公開資訊",
        jd: "JD 與公開資訊",
        interview: "含面試資訊",
        full: "含 Offer 與個人條件"
      };
      const scoreLabels = {
        role_substance: "工作內容含金量",
        learning_gain: "學習增量",
        resume_outcome_potential: "履歷成果潛力",
        team_company_leverage: "團隊／公司加成",
        overall_roi: "整體投入報酬"
      };
      const outcomeLabels = {
        skills: "能力",
        projects: "專案",
        metrics: "數據",
        artifacts: "作品",
        resume_bullets: "履歷成果"
      };
      const tierLabels = { strong: "Strong Evidence", signal: "Signal", weak: "Weak Evidence" };
      const directionLabels = { positive: "Positive", negative: "Negative", unknown: "Unknown" };

      document.title = `${report.subject.company}｜實習 Offer 決策摘要`;
      byId("company-title").textContent = `${report.subject.company} · ${report.subject.job_title}`;
      byId("report-meta").textContent = `${levelLabels[report.input_level]} · Base Case · 信心 ${report.decision.confidence}`;
      const recommendation = report.decision.recommendation_score;
      byId("hero-score").textContent = Number(recommendation).toFixed(1);
      appendText(byId("hero-score"), "small", " / 10");
      byId("hero-verdict").textContent = verdictLabels[report.decision.verdict] || report.decision.verdict;
      byId("headline").textContent = report.decision.one_line_conclusion;
      byId("base-case").textContent = report.decision.base_case;
      fillList("reasons-for", report.decision.reasons_for);
      fillList("reasons-against", report.decision.reasons_against);

      const scoreList = byId("score-list");
      Object.keys(scoreLabels).forEach(key => {
        const item = report.scores[key];
        appendText(scoreList, "strong", scoreLabels[key]);
        const bar = appendText(scoreList, "div", "", "bar");
        const fill = appendText(bar, "span", "");
        fill.style.width = `${Math.max(0, Math.min(100, item.score * 10))}%`;
        appendText(scoreList, "span", Number(item.score).toFixed(1));
        appendText(scoreList, "p", item.rationale, "score-note");
      });

      const outcomes = byId("outcomes");
      const resumeExperiences = byId("resume-experiences");
      report.takeaways.resume_experiences.forEach((item, index) => {
        const card = appendText(resumeExperiences, "article", "", "card resume-experience");
        appendText(card, "h3", `${index + 1}. ${item.title}`);
        appendText(card, "p", item.resume_bullet, "resume-bullet");
        appendText(card, "p", "可量化線索", "experience-label");
        const quantification = appendText(card, "ul", "", "clean");
        item.quantification_clues.forEach(value => appendText(quantification, "li", value));
        appendText(card, "p", "可偷師的方法", "experience-label");
        const learning = appendText(card, "ul", "", "clean");
        item.learning_to_capture.forEach(value => appendText(learning, "li", value));
        appendText(card, "p", "Base Case 邊界", "experience-label");
        appendText(card, "p", item.base_case_boundary);
      });
      Object.keys(outcomeLabels).forEach(key => {
        const card = appendText(outcomes, "article", "", "card");
        appendText(card, "h3", outcomeLabels[key]);
        const list = appendText(card, "ul", "", "clean");
        const items = report.takeaways[key] || [];
        if (!items.length) appendText(list, "li", "Base Case 未將此項列入可帶走成果。", "empty");
        items.forEach(item => appendText(list, "li", item));
      });

      const risks = byId("risks");
      if (!report.risks.length) appendText(risks, "p", "未形成明確負面證據；這不等於不存在風險。", "card empty");
      report.risks.forEach(risk => {
        const card = appendText(risks, "article", "", `card risk ${risk.severity}`);
        appendText(card, "h3", risk.title);
        appendText(card, "p", risk.description);
        appendText(card, "div", `嚴重度：${risk.severity} · 發生可能：${risk.likelihood}`, "risk-meta");
        appendText(card, "p", `對學生的影響：${risk.student_impact}`);
        if (risk.mitigation) appendText(card, "p", `既有緩衝：${risk.mitigation}`);
      });

      const uncertainties = byId("uncertainties");
      if (!report.decision_uncertainties.length) appendText(uncertainties, "p", "沒有足以改變 Base Case 的重大資訊缺口。", "card empty");
      report.decision_uncertainties.forEach(item => {
        const card = appendText(uncertainties, "article", "", "card uncertainty");
        appendText(card, "h3", item.title);
        const definition = appendText(card, "dl", "");
        [["缺少的證據", item.missing_evidence], ["對分數的影響", item.score_effect], ["Base Case 採用的判斷", item.base_case_assumption]].forEach(([term, description]) => {
          appendText(definition, "dt", term);
          appendText(definition, "dd", description);
        });
      });

      fillList("suitable", report.fit.suitable_for);
      fillList("unsuitable", report.fit.unsuitable_for);

      const evidenceRoot = byId("evidence-list");
      if (!report.evidence.length) appendText(evidenceRoot, "p", "目前沒有可列出的公開或輸入證據。", "empty");
      report.evidence.forEach(item => {
        const row = appendText(evidenceRoot, "article", "", "evidence");
        appendText(row, "span", item.id, "tag");
        appendText(row, "span", tierLabels[item.tier], "tag");
        appendText(row, "span", directionLabels[item.direction], "tag");
        appendText(row, "strong", ` ${item.title}`);
        appendText(row, "p", item.claim);
        appendText(row, "p", `與決策的關係：${item.relevance}`, "risk-meta");
        if (item.url) {
          const link = appendText(row, "a", item.url);
          link.href = item.url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
        }
      });

      const hash = document.querySelector('meta[name="report-json-sha256"]').content;
      byId("fingerprint").textContent = `report.json SHA-256: ${hash}`;
    })();
  </script>
</body>
</html>
